# Nocne testy → krispolik6@gmail.com
# Codziennie 03:03 Europe/Warsaw (CET/CEST)
# Secrets: SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM
name: Nightly Tests

on:
  schedule:
    # 03:03 Warsaw ≈ 01:03 UTC (CET) / 02:03 UTC gdy zimowy; używamy 01:03 UTC
    # + workflow_dispatch. Lokalnie: npm run nightly-test:daemon (zegar systemowy).
    - cron: '3 1 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run nightly tests and send report
        env:
          TZ: Europe/Warsaw
          DEVELOPER_REPORT_EMAIL: krispolik6@gmail.com
          DEVELOPER_MAIL_SEND: '1'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NODE_ENV: development
        run: npm run nightly-test
